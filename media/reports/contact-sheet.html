<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><title>loading</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1d1b20;color:white;font-family:system-ui,sans-serif}
    main{width:2560px;height:1440px;padding:28px;display:grid;grid-template-rows:58px 1fr;gap:18px}h1{margin:0;font-size:34px;letter-spacing:.02em}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:14px}.global{grid-template-rows:repeat(2,1fr)}figure{margin:0;position:relative;overflow:hidden;border-radius:10px;background:#f7f0e7}img{width:100%;height:100%;object-fit:cover}figcaption{position:absolute;left:10px;bottom:10px;background:#1d1b20d9;padding:5px 9px;border-radius:99px;font-weight:700}
  </style>
</head>
<body><main><h1></h1><section class="grid"></section></main>
<script>
  const p=new URLSearchParams(location.search),scene=p.get('scene'),grid=document.querySelector('.grid'),title=document.querySelector('h1');
  const labels=['0.05 s','0.60 s','1.20 s','1.80 s','2.50 s','3.10 s','3.70 s','4.30 s','4.90 s'];
  let items;
  if(scene==='global'){
    title.textContent='INOXNOW · Comparativa global · fotograma medio';grid.classList.add('global');
    items=['01','02','03','04','05','06'].map(id=>({src:`../keyframes/audit/scene-${id}/frame-2-50.png`,label:`Escena ${id}`}));
  }else{
    title.textContent=`INOXNOW · Escena ${scene} · secuencia representativa`;
    items=labels.map((label,index)=>({src:`../keyframes/audit/scene-${scene}/frame-${label.replace(' s','').replace('.','-')}.png`,label}));
  }
  let loaded=0;
  for(const item of items){const figure=document.createElement('figure'),img=new Image(),caption=document.createElement('figcaption');img.src=item.src;img.alt=item.label;caption.textContent=item.label;figure.append(img,caption);grid.append(figure);img.onload=()=>{if(++loaded===items.length)document.title='frame-ready'};img.onerror=()=>{document.title='error'}}
</script></body></html>
