<!doctype html><meta charset="utf-8"><title>loading</title><pre>Auditoría en curso…</pre>
<script type="module">
const clips=[
['01','scene-01-internal-motion-minimax-h3-2k-original.mp4'],['02','scene-02-internal-motion-minimax-h3-2k-original.mp4'],['03','scene-03-internal-motion-corrected-minimax-h3-2k-original.mp4'],['04','scene-04-internal-motion-minimax-h3-2k-original.mp4'],['05','scene-05-installation-motion-minimax-h3-2k-original.mp4'],['06','scene-06-internal-motion-minimax-h3-2k-original.mp4']];
const wait=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
const once=(target,event)=>new Promise((resolve,reject)=>{target.addEventListener(event,resolve,{once:true});target.addEventListener('error',reject,{once:true})});
const results=[];
for(const [scene,file] of clips){
  const video=document.createElement('video');video.muted=true;video.playsInline=true;video.preload='auto';video.src=`../generated-clips/${file}`;document.body.append(video);
  await once(video,'loadedmetadata');
  const mediaTimes=[];let collecting=true;
  function frame(_,metadata){if(collecting){mediaTimes.push(metadata.mediaTime);video.requestVideoFrameCallback(frame)}}
  video.requestVideoFrameCallback(frame);
  await video.play();await once(video,'ended');collecting=false;
  const deltas=mediaTimes.slice(1).map((value,index)=>value-mediaTimes[index]).filter(value=>value>.001).sort((a,b)=>a-b);
  const median=deltas[Math.floor(deltas.length/2)]||0;
  const descending=[];
  for(const time of [4.9,4.3,3.7,3.1,2.5,1.8,1.2,.6,.05]){video.currentTime=Math.min(time,video.duration-.04);await once(video,'seeked');descending.push(video.currentTime)}
  const quality=video.getVideoPlaybackQuality();
  results.push({scene,file,duration:video.duration,width:video.videoWidth,height:video.videoHeight,estimated_fps:median?Math.round((1/median)*1000)/1000:null,forward_frames_observed:mediaTimes.length,dropped_frames:quality.droppedVideoFrames,reverse_seek_completed:descending.every((value,index,array)=>index===0||value<array[index-1]),reverse_samples:descending,decoded_audio_bytes:video.webkitAudioDecodedByteCount??null});
  video.remove();
}
window.auditResults=results;document.querySelector('pre').textContent=JSON.stringify(results,null,2);document.title='metadata-ready';
</script>
