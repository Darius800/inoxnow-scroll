<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INOXNOW · Puentes espaciales 2.5D</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f7f0e7; color: #292726; font-family: system-ui, sans-serif; }
    main { display: grid; min-height: 100vh; place-items: center; gap: 16px; padding: 24px; box-sizing: border-box; }
    canvas { width: min(100%, 1280px); height: auto; aspect-ratio: 16 / 9; background: #f7f0e7; box-shadow: 0 24px 60px rgba(63, 48, 38, 0.12); }
    .controls { display: flex; width: min(100%, 1280px); gap: 16px; align-items: center; }
    select { padding: 8px 12px; }
    input { flex: 1; }
  </style>
</head>
<body>
  <main>
    <canvas width="2560" height="1440" aria-label="Previsualización reversible de transición espacial"></canvas>
    <div class="controls">
      <select aria-label="Transición"></select>
      <input type="range" min="0" max="1" step="0.001" value="0" aria-label="Progreso reversible">
    </div>
  </main>
  <script type="module">
    import { createSpatialTransition, spatialBridges } from './spatial-transition-2_5d.js';
    const canvas = document.querySelector('canvas');
    const select = document.querySelector('select');
    const range = document.querySelector('input');
    let transition;
    const requestedProgress = Number(new URLSearchParams(location.search).get('p') || 0);
    range.value = String(Math.max(0, Math.min(1, requestedProgress)));

    for (const bridge of spatialBridges) {
      const option = document.createElement('option');
      option.value = bridge.id;
      option.textContent = bridge.id.replace('-', ' → ');
      select.append(option);
    }

    async function loadSelected() {
      const bridge = spatialBridges.find(item => item.id === select.value);
      transition = await createSpatialTransition(canvas, bridge);
      transition.render(Number(range.value));
      document.title = 'frame-ready';
    }

    select.addEventListener('change', loadSelected);
    range.addEventListener('input', () => transition?.render(Number(range.value)));
    loadSelected();
  </script>
</body>
</html>
